<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Mission Control{% endblock %} - Capability Agent</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { brand: { 50:'#eef2ff',100:'#e0e7ff',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca' } }
}}}
</script>
<style>
  body { background: radial-gradient(1200px 600px at 10% -10%, #1e1b4b 0%, #0b0f1a 45%, #05070c 100%); }
  .glass { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(6px); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #312e81; border-radius: 8px; }
</style>
</head>
<body class="h-full text-slate-200 font-sans antialiased">
<div class="flex min-h-full">
  <aside class="w-64 shrink-0 border-r border-white/10 px-6 py-8 hidden md:block">
    <div class="flex items-center gap-2 mb-10">
      <div class="h-9 w-9 rounded-lg bg-gradient-to-br from-brand-500 to-fuchsia-500 flex items-center justify-center font-bold text-white">CA</div>
      <div>
        <div class="font-semibold text-white leading-none">Mission Control</div>
        <div class="text-xs text-slate-400 mt-1">Capability Agent</div>
      </div>
    </div>
    <nav class="space-y-1 text-sm">
      <a href="/" class="block px-3 py-2 rounded-lg hover:bg-white/5 text-slate-300 hover:text-white transition">Overview</a>
      <a href="/#artifacts" class="block px-3 py-2 rounded-lg hover:bg-white/5 text-slate-300 hover:text-white transition">Capabilities</a>
      <a href="/#runs" class="block px-3 py-2 rounded-lg hover:bg-white/5 text-slate-300 hover:text-white transition">Run Evidence</a>
    </nav>
    <div class="mt-10 pt-6 border-t border-white/10 text-xs text-slate-500 leading-relaxed">
      Discovery runs with an LLM. Replay runs without one. This console only
      reads evidence on disk, plus one real action: resuming an escalation.
    </div>
  </aside>
  <main class="flex-1 px-6 md:px-10 py-8 max-w-6xl mx-auto w-full">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
