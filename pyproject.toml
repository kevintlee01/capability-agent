[project]
name = "capability-agent"
version = "0.1.0"
description = "An LLM-driven computer-use agent that discovers a flow once, saves it as a typed capability artifact, and replays it deterministically without the model in the loop."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "google-genai>=2.25.0",
    "jinja2>=3.1.6",
    "openai>=3.22.1",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not cross_browser'"
markers = ["cross_browser: real browser launches across chromium/firefox/webkit (slow, excluded by default)"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
omit = ["tests/*"]
