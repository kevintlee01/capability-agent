{% extends "base.html" %}
{% block content %}
<div class="card">
<h2>Open Sub-Account</h2>
<p style="color:var(--muted); margin-top:-8px;">{{ member.first_name }} {{ member.last_name }} &middot; Member {{ member.member_id }}</p>
{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
<form method="post" action="/member/{{ member.member_id }}/open-subaccount">
<table class="field-table">
<tr><td class="field-label">Account Type</td><td>
<select name="account_type">
<option value="Savings">Savings</option>
<option value="Checking">Checking</option>
</select>
</td></tr>
<tr><td class="field-label">Nickname</td><td><input type="text" name="nickname"></td></tr>
<tr><td class="field-label">Initial Deposit</td><td><input type="number" name="initial_deposit" step="0.01" min="0" inputmode="decimal"></td></tr>
<tr><td></td><td><input type="submit" value="Open Account"></td></tr>
</table>
</form>
<a class="btn-link" href="/member/{{ member.member_id }}">&larr; Back to Member</a>
</div>
{% endblock %}
